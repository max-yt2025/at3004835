<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Links</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #121212;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
}

h1 {
    margin-bottom: 25px;
    font-size: 2rem;
}

.link {
    display: block;
    width: 220px;
    margin: 12px auto;
    padding: 15px;
    background: #1f1f1f;
    border: 2px solid #444;
    border-radius: 12px;
    color: white;
    text-decoration: none;
    font-size: 1.2rem;
    cursor: pointer;
    transition: 0.25s;
}

.link:hover {
    background: #2d2d2d;
    border-color: #4da3ff;
    transform: scale(1.05);
}
</style>
</head>
<body>

<div class="container">
    <h1>Quick Links</h1>

    <div class="link" onclick="go('https://www.google.com')">Google</div>
    <div class="link" onclick="go('https://discord.com')">Discord</div>
    <div class="link" onclick="go('https://www.tiktok.com')">TikTok</div>
    <div class="link" onclick="go('https://www.snapchat.com')">Snapchat</div>
</div>

<script>
function go(url) {
    window.location.href = url;
}
</script>

</body>
</html>
